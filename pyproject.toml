[project]
name = "reasoning-bank"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
# BrowserGym 0.14.1 pins Playwright 1.44 / greenlet 3.0.3, which require Python <3.13.
requires-python = ">=3.12,<3.13"
dependencies = [
    # Critical: Must match MemEvol_cleaned for correct reward calculation
    "browsergym-core==0.14.1",
    "browsergym-experiments==0.14.1",
    "browsergym-webarena==0.14.1",
    "browsergym==0.14.1",
    "playwright==1.44.0",
    # Allow newer compatible versions for other packages
    "anthropic>=0.64.0",
    "google-cloud-aiplatform>=1.108.0",
    "google-genai>=1.21.1",
    "langchain>=0.3.26",
    "langchain-anthropic>=0.3.19",
    "langchain-community>=0.3.26",
    "langchain-openai>=1.1.11",
    "mini-swe-agent",
    "openai>=2.26.0",
    "pillow>=11.2.1",
    "torch>=2.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.11",
]

[tool.uv.sources]
mini-swe-agent = { path = "third_party", editable = true }

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
